services:
  backend:
    image: proshadi/eventflow-backend:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    restart: always

  frontend:
    image: proshadi/eventflow-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always