server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.stadiamaps.com https://*.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://145.220.72.88:8080 https://*.stadiamaps.com; worker-src blob:;" always;add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}